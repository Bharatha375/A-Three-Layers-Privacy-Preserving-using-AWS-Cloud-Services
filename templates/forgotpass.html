<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f7f9fc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      border-radius: 1rem;
      box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
    }

    .form-label {
      font-weight: 500;
    }

    .forgot-link {
      text-decoration: none;
      color: #0d6efd;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card w-100" style="max-width: 450px;">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4 text-primary">Forgot Password</h3>

        <form id="login-form" action="{% url 'forgotPassword' %}" method="post" class="needs-validation" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label for="studentId" class="form-label">Email</label>
            <input type="text" class="form-control" name="studentmail" id="studentId" placeholder="Enter your email" required>
            <div class="invalid-feedback">
              Please enter your valid mail.
            </div>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">forgot password</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS with validation script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Bootstrap form validation
    (function () {
      'use strict'
      const forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }
          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>

</body>
</html>
